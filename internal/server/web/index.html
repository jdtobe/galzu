<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herd</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Herd</h1><span>Social prototype · no external agent tools</span></header><main><section id="setup"><h2>Start a herd</h2><form id="create"><label>Goal<textarea name="goal" required></textarea></label><label>Inference concurrency<input name="concurrency" type="number" min="1" max="32" value="1"></label><label>Agents — one per line: name, role, installed Ollama model<textarea name="agents" required>Rowan, leader, lfm3-1.7b-uncensored:q6-k
Sage, helper, lfm3-1.7b-uncensored:q6-k</textarea></label><label class="thinking-setting"><input type="checkbox" name="thinking"> Request model thinking for all agents (if supported)</label><fieldset><legend>Future network scope (optional)</legend><p>Saved for later; agents cannot use network tools yet. Use a literal IP address.</p><label>Allowed target IP<input name="target_ip" placeholder="e.g. 192.0.2.10"></label><label>Minimum interval between requests (milliseconds)<input name="rate_interval_ms" type="number" min="1" max="3600000" placeholder="e.g. 1000"></label></fieldset><button>Start session</button></form><h2>Open a session</h2><form id="open"><label>Session ID<input name="id" required></label><button>Open</button></form></section><section id="session" hidden><div class="heading"><div><h2 id="goal"></h2><small id="sid"></small></div><button id="pause">Pause herd</button></div><p id="status"></p><p id="storage-warning" role="alert"></p><button id="storage-recover" type="button" hidden>Retry storage recovery</button><div class="layout"><aside><h3>Agents</h3><ul id="agents"></ul></aside><article><h3>Herd conversation</h3><div id="messages"></div><form id="send"><label>Send to<select id="recipient" name="recipient_id"><option value="">Everyone</option></select></label><p id="recipient-warning" role="status"></p><label>Message<textarea name="body" maxlength="4096" required></textarea></label><button>Send</button></form></article></div></section><p id="error" role="alert"></p></main><script src="/app.js"></script></body></html>
