      <use xlink:href="#classic" x="235" y="603" width="38" height="38"/>
      <use xlink:href="#classic" x="330" y="610" width="24" height="24"/>
      <g font-size="10" fill="#66756c" text-anchor="middle"><text x="164" y="667">46 px</text><text x="254" y="667">38 px</text><text x="342" y="667">24 px</text></g>
      <rect x="64" y="690" width="392" height="108" rx="10" fill="#173e33"/>
      <text x="80" y="711" font-size="9" letter-spacing="1" fill="#b6d3c6">REVERSED ON DARK</text>
      <use xlink:href="#classic" x="141" y="728" width="46" height="46" color="#f8faf7"/>
      <use xlink:href="#classic" x="235" y="732" width="38" height="38" color="#f8faf7"/>
      <use xlink:href="#classic" x="330" y="739" width="24" height="24" color="#f8faf7"/>
      <text x="64" y="826" font-size="11" fill="#66756c">Quietest evolution of the current mark.</text>
    </g>
    <g transform="translate(460)">
      <rect x="40" y="150" width="440" height="700" rx="16" fill="#fff" stroke="#dce4db"/>
      <text x="64" y="191" font-size="22" font-weight="600" fill="#243630">B / Backstage</text>
      <text x="64" y="219" font-size="13" fill="#66756c">Shaggier hair. More character. A little louder.</text>
      <use xlink:href="#backstage" x="120" y="242" width="280" height="280"/>
      <path d="M64 548 H456" stroke="#e3e9e2"/>
      <text x="64" y="578" font-size="11" fill="#66756c">SIDEBAR SCALE</text>
      <use xlink:href="#backstage" x="141" y="599" width="46" height="46"/>
      <use xlink:href="#backstage" x="235" y="603" width="38" height="38"/>
      <use xlink:href="#backstage" x="330" y="610" width="24" height="24"/>
      <g font-size="10" fill="#66756c" text-anchor="middle"><text x="164" y="667">46 px</text><text x="254" y="667">38 px</text><text x="342" y="667">24 px</text></g>
