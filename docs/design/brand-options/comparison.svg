      <path d="M64 548 H456" stroke="#e3e9e2"/>
      <text x="64" y="578" font-size="11" fill="#66756c">SIDEBAR SCALE</text>
      <use xlink:href="#stamp" x="141" y="599" width="46" height="46"/>
      <use xlink:href="#stamp" x="235" y="603" width="38" height="38"/>
      <use xlink:href="#stamp" x="330" y="610" width="24" height="24"/>
