      <text x="80" y="711" font-size="9" letter-spacing="1" fill="#b6d3c6">REVERSED ON DARK</text>
      <use xlink:href="#backstage" x="141" y="728" width="46" height="46" color="#f8faf7"/>
      <use xlink:href="#backstage" x="235" y="732" width="38" height="38" color="#f8faf7"/>
      <use xlink:href="#backstage" x="330" y="739" width="24" height="24" color="#f8faf7"/>
      <text x="64" y="826" font-size="11" fill="#66756c">Strongest rocker personality.</text>
    </g>
    <g transform="translate(920)">
      <rect x="40" y="150" width="440" height="700" rx="16" fill="#fff" stroke="#dce4db"/>
      <text x="64" y="191" font-size="22" font-weight="600" fill="#243630">C / Stamp</text>
      <text x="64" y="219" font-size="13" fill="#66756c">Fewer details. Bolder shape. More logo-like.</text>
