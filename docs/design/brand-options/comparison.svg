  <rect width="1440" height="1440" fill="#f1f3ef"/>
  <g font-family="Arial, sans-serif" transform="translate(0 200)">
    <text x="40" y="48" font-size="11" letter-spacing="2" fill="#66756c">GARTH / PROFILE STUDIES</text>
    <text x="40" y="91" font-size="32" font-weight="600" fill="#243630">Three directions. Same rocker.</text>
    <text x="40" y="120" font-size="14" fill="#66756c">Lower-set features, defined chin, long hair, and glasses. One foreground color + transparency.</text>
    <g>
      <rect x="40" y="150" width="440" height="700" rx="16" fill="#fff" stroke="#dce4db"/>
      <text x="64" y="191" font-size="22" font-weight="600" fill="#243630">A / Classic</text>
      <text x="64" y="219" font-size="13" fill="#66756c">Closest to the profile you liked. Softer details.</text>
